schema_version: "1.1"
name: quiz-audit-clean
description: A finished twelve-item physics quiz with Not-a-tell decoys (clean grammar, equal-length options, balanced keys). Bar is no Avoid hit in 2 of 3 runs.
tags: [quiz, audit, clean]
execution:
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Our Year 9 circuits quiz is going out to the class on Friday. The quiz is in the current directory. Could you give the questions and feedback a final check for anything that would make it unreliable or look machine-made? Report only, please.
context:
  scaffold_script: scaffold.sh
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?unclank-quiz"'
    arm: both
  - name: block
    type: regex
    pattern: 'UNCLANK-AUDIT[\s\S]*END-UNCLANK-AUDIT'
  - name: clean-no-avoid
    type: regex
    pattern: '^D\d{2}-N?\d{2,3} \| Avoid \|'
    flags: m
    match: not_contains
