schema_version: "1.1"
name: store-unrelated
description: An unrelated game-dev request. No unclank skill should fire.
tags: [store, trigger, unrelated]
execution:
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    How do I make a jump feel less floaty in Godot 4? My character is a CharacterBody2D and it hangs at the top of the arc for too long.
graders:
  - name: not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?unclank'
    min: 0
    max: 0
    arm: both
