schema_version: "1.1"
name: quiz-unrelated
description: An unrelated request that mentions questions but is not about quiz items. No unclank skill should fire.
tags: [quiz, trigger, unrelated]
execution:
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I'm building a FAQ page with about ten questions and answers. What's a good HTML structure for it so each question expands and collapses? A short example with two questions is enough.
graders:
  - name: not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?unclank'
    min: 0
    max: 0
    arm: both
