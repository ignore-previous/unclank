schema_version: "1.1"
name: launch-unrelated
description: An unrelated request. No unclank skill should fire.
tags: [launch, trigger, unrelated]
execution:
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    What's the difference between a Python list and a tuple? One short example of each, please.
graders:
  - name: not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?unclank'
    min: 0
    max: 0
    arm: both
