schema_version: "1.1"
name: store-audit-planted
description: A small game about to go on Steam and itch.io with six planted Avoid tells. Bar is 80% of tell-* graders, the skill firing, and the audit block.
tags: [store, audit, planted]
execution:
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    The game repo is in the current directory. We submit Lanternfall to Steam next week and to itch.io after that. Can you check it before we do? The store page text, the Steam survey answers and the itch.io settings are all written up in store/. Please don't change anything.
context:
  scaffold_script: scaffold.sh
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?unclank-store"'
    arm: both
  - name: block
    type: regex
    pattern: 'UNCLANK-AUDIT[\s\S]*END-UNCLANK-AUDIT'
  # no asset register; AI portraits and voices listed as in the build
  - name: tell-d10-012
    type: regex
    pattern: '^(D10-012) \| Avoid \|'
    flags: m
  # portraits marked temp that ship
  - name: tell-d06-002
    type: regex
    pattern: '^(D06-002) \| Avoid \|'
    flags: m
  # Steam survey says no AI, build has AI portraits and voices
  - name: tell-d10-001
    type: regex
    pattern: '^(D10-001) \| Avoid \|'
    flags: m
  # capsule and key art made with an image model, not disclosed
  - name: tell-d10-002
    type: regex
    pattern: '^(D10-002) \| Avoid \|'
    flags: m
  # itch.io game with AI content, AI Disclosure unset
  - name: tell-d10-004
    type: regex
    pattern: '^(D10-004) \| Avoid \|'
    flags: m
  # cast dominated by Elara, Elias, Mara, Voss, Vance, Clara, Elena
  - name: tell-d06-001
    type: regex
    pattern: '^(D06-001) \| Avoid \|'
    flags: m
