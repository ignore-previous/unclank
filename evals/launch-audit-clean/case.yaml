schema_version: "1.1"
name: launch-audit-clean
description: A finished site with Not-a-tell decoys (Vite, favicon.ico, one true CI badge, a README emoji). Bar is no Avoid hit in 2 of 3 runs.
tags: [launch, audit, clean]
execution:
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    We're launching Tidepool next week. The project is in the current directory. Could you give it a final launch check for anything that looks unfinished or default? Report only, please.
context:
  scaffold_script: scaffold.sh
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?unclank-launch"'
    arm: both
  - name: block
    type: regex
    pattern: 'UNCLANK-AUDIT[\s\S]*END-UNCLANK-AUDIT'
  - name: clean-no-avoid
    type: regex
    pattern: '^D\d{2}-N?\d{2,3} \| Avoid \|'
    flags: m
    match: not_contains
