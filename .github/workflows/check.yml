name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays: also check that source links still load
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the checker
        run: python -m unittest discover -s scripts
      - name: Static checks
        env:
          UNCLANK_PRIVATE_TERMS: ${{ secrets.UNCLANK_PRIVATE_TERMS }}
        run: python scripts/check.py

  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source links
        run: python scripts/check.py --links
